[project]
name = "pistage"
version = "1.0.0"
description = "Python binding for the experimental PI stage driver (serial), with a mock"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samuel Palato", email = "7659022+spalato@users.noreply.github.com" },
]
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pyserial",
]

[project.urls]
Repository = "https://github.com/spalato/edyxlib"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
