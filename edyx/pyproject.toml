[project]
name = "edyx"
version = "0.2.0"
description = "Core data I/O, analysis, and plotting utilities for the lab"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samuel Palato", email = "7659022+spalato@users.noreply.github.com" },
]
license = "MIT"
license-files = ["LICENSE.txt"]  # per-package copy of the repo-level LICENSE.txt
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "lmfit",
    "typer",
    "rich",
    # TODO: add packages that are part of our "standard distribution""
    "scistyles",
    "colorcet",
    "jupyterlab>=4.6.6",
    "tomli-w>=1.2.0",
]

[project.scripts] # command line tools.
spectra-fit = "edyx.scripts.spectra_fit:app"
collect-asc ="edyx.scripts.collect_asc:app"

[project.urls]
Repository = "https://github.com/spalato/edyxlib"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
