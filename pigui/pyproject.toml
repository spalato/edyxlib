[project]
name = "pigui"
version = "0.1.0"
description = "Simple experimental UI for the PI stage"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Samuel Palato", email = "7659022+spalato@users.noreply.github.com" },
]
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pistage>=1.0.0",
    "PySide6",
    "qtlets",
    "attrs",
    "tomli-w",
    "typer",
    "rich",
    "platformdirs",
]

[project.scripts]
pigui = "pigui.launch_pigui:app"

[project.urls]
Repository = "https://github.com/spalato/edyxlib"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
pistage = { path = "../pistage", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
